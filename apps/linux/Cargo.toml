# Relayable Linux desktop app (GPUI).
#
# `full.md` §5.3: GPUI-specific code lives only in `apps/linux`. This package is
# intentionally its own Cargo workspace (empty `[workspace]` table below) so its
# dependency pins and `Cargo.lock` can never affect the repository-root workspace
# or the shared `crates/**`.
#
# The `gpui = "=0.2.2"` pin matches ADR-003 (Option H). On this host the pin
# resolves but does not compile at `xattr 0.2.3` -> `libc 0.2.190` (removed
# `libc::ENOATTR`); see `evidence/TERM-002-remedy.md` for the contained remedy
# (`libc` held at 0.2.189 in this workspace's `Cargo.lock` only).

[package]
name = "relayable-linux"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Relayable Linux desktop app (GPUI), UI-001 minimal window"

[lib]
# The token sheet / app logic is a reusable, deliberately GPUI-free library so a
# future framework revision cannot drag GPUI types through it (`full.md` §5.3).
name = "relayable_linux"
path = "src/lib.rs"

[[bin]]
name = "relayable"
path = "src/main.rs"

# GPUI-free live-proof binary (UI-002 stage A): connects to the real server,
# creates a session, attaches a writer, drives a `TerminalModel` and proves a
# resize via `stty size`. Kept out of `src/main.rs` so it never links GPUI.
[[bin]]
name = "live-probe"
path = "src/bin/live-probe.rs"

[dependencies]
gpui = "=0.2.2"

# Core crates consumed as PATH dependencies into the repository's main
# workspace. `apps/linux` keeps its own `Cargo.lock`/`[workspace]`, so these
# additions cannot change the core crates or the root workspace's resolution.
relayable-client = { path = "../../crates/relayable-client" }
relayable-model = { path = "../../crates/relayable-model" }
relayable-protocol = { path = "../../crates/relayable-protocol", features = ["transport-unix"] }

# ADR-003 terminal-engine pins (exact). Both are present in the local registry
# cache; `ansi` is required to name `vte::ansi` directly (alacritty_terminal
# already enables it, so this adds no new crates).
alacritty_terminal = "=0.26.0"
vte = { version = "=0.15.0", features = ["ansi"] }

[workspace]
