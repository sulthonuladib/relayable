[package]
name = "relayable-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Relayable cross-crate end-to-end integration tests (CORE-001)"

[lib]
path = "src/lib.rs"

[[test]]
name = "protocol"
path = "protocol/main.rs"

[[test]]
name = "lifecycle"
path = "lifecycle/main.rs"

[[test]]
name = "reconnect"
path = "reconnect/main.rs"

[[test]]
name = "multi-client"
path = "multi-client/main.rs"

[[test]]
name = "events"
path = "events/main.rs"

[[test]]
name = "flow-control"
path = "flow-control/main.rs"

[[test]]
name = "context-resolution"
path = "context-resolution/main.rs"

[[test]]
name = "client-output"
path = "client-output/main.rs"

[dependencies]
relayable-model = { workspace = true }
relayable-protocol = { workspace = true, features = ["transport-unix"] }
relayable-client = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
