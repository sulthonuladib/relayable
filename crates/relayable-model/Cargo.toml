[package]
name = "relayable-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Relayable domain model: entities, tagged IDs, revisions, snapshots"

[dependencies]
# UUIDv7 identity (ADR-001 Decision B; RFC 9562 §5.7). `v7` pulls `rng`.
uuid = { workspace = true, features = ["v7"] }
# Structured `IdError` only; no serialization, transport, or runtime dependency.
thiserror = { workspace = true }
