// Relayable protocol v1 — control operations (sessions, blocks, snapshot).
//
// Sources:
// - `docs/architecture/interface-contract.md` §2 (session snapshot schema),
//   §3 (envelope), §5 (terminal stream interface), §7 (snapshot/sequence).
// - `SessionCreateRequest/Response`, `SessionList*`, `SessionSnapshot*`,
//   `SessionClose*`, `BlockAttach*`, `BlockDetach*`, `TerminalInputAccepted`,
//   `TerminalResizeAccepted`, and the record/state messages below are
//   Relayable-defined (no REX evidence) except where a field name is documented
//   in the matrix (§8.2 Schemas and examples; §10 Events; §12 Multi-client
//   behavior; §13 Connection lifecycle): `session_id`, `block_id`, `window_id`,
//   `revision`, `client_id`, `principal`, `connection_state`,
//   `connected_at`, `exit_code`, `pwd`, `title`, `state`, `progress`.
// See `protocol/compatibility/core-001-method-set.md` and
// `protocol/compatibility/core-002-method-set.md`.
//
// CORE-002 note: `SessionState` is defined in `events.proto` and re-exported to
// this file by import. The definition moved (same package, same wire meaning,
// same generated fully-qualified type `relayable.protocol.v1.SessionState`) so
// that `events.proto` needs no import and `control.proto` can import the `Event`
// type carried by `SessionResumeResponse` without a protobuf import cycle.

syntax = "proto3";

package relayable.protocol.v1;

import "terminal.proto";
import "events.proto";

message SessionCreateRequest {
  optional string label = 1;
}

message SessionCreateResponse {
  SessionRecord session = 1;
  string window_id = 2;
  string block_id = 3;
  string pty_process_id = 4;
  uint32 program_pid = 5;
}

message SessionListRequest {}

message SessionSummary {
  string session_id = 1;
  optional string label = 2;
  SessionState state = 3;
  uint64 revision = 4;
}

message SessionListResponse {
  repeated SessionSummary sessions = 1;
  uint64 sequence = 2;
}

message SessionSnapshotRequest {
  string session_id = 1;
}

message SessionSnapshotResponse {
  uint64 sequence = 1;
  ServerRecord server = 2;
  SessionRecord session = 3;
  repeated WindowRecord windows = 4;
  repeated BlockRecord blocks = 5;
  repeated ClientRecord clients = 6;
}

message ServerRecord {
  string server_id = 1;
  string protocol_version = 2;
  uint64 sequence = 3;
  uint64 started_at_unix_millis = 4;
}

message SessionRecord {
  string session_id = 1;
  optional string label = 2;
  uint64 revision = 3;
  SessionState state = 4;
  uint64 created_at_unix_millis = 5;
}

message WindowRecord {
  string window_id = 1;
  string session_id = 2;
  optional string label = 3;
  uint64 revision = 4;
  bool active = 5;
}

message BlockRecord {
  string block_id = 1;
  string window_id = 2;
  string session_id = 3;
  BlockKind kind = 4;
  optional string label = 5;
  uint64 revision = 6;
  uint32 cols = 7;
  uint32 rows = 8;
  ProgramStatus program_status = 9;
  string pty_process_id = 10;
  uint32 program_pid = 11;
  bool writer_attached = 12;
}

message ProgramStatus {
  ProgramState state = 1;
  optional uint32 exit_code = 2;
  optional string signal = 3;
  optional string pwd = 4;
  optional string title = 5;
}

message ClientRecord {
  string client_id = 1;
  string kind = 2;
  string platform = 3;
  string version = 4;
  string connection_state = 5;
  optional string principal = 6;
  uint64 connected_at_unix_millis = 7;
}

message SessionCloseRequest {
  string session_id = 1;
}

message SessionCloseResponse {
  SessionRecord session = 1;
}

message BlockAttachRequest {
  string block_id = 1;
  AttachMode mode = 2;
  // CORE-002: `takeover = true` from a second client holding a valid session
  // takes the single writer lease from the previous holder (contract §5).
  // Default `false` preserves the CORE-001 behavior (reject with
  // `input_not_owned`). Additive new tag 3 per ADR-002 D3.
  bool takeover = 3;
}

message BlockAttachResponse {
  uint64 stream_id = 1;
  AttachMode mode = 2;
  bool writer_lease = 3;
  TerminalSnapshot snapshot = 4;
}

message BlockDetachRequest {
  uint64 stream_id = 1;
}

message BlockDetachResponse {
  uint64 stream_id = 1;
}

message TerminalInputAccepted {
  uint64 stream_id = 1;
  uint64 accepted_bytes = 2;
}

message TerminalResizeAccepted {
  uint64 stream_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

// CORE-002 control operations: `session.resume` (see
// `protocol/compatibility/core-002-method-set.md`).
//
// `session.resume` synchronizes a (re)connecting client with the server-wide
// retained control-event log. A cursor of `last_sequence_applied = 0` means
// "no cursor": the server answers with a fresh snapshot, never a false replay.
message SessionResumeRequest {
  string session_id = 1;
  uint64 last_sequence_applied = 2;
}

// Reply to `session.resume`.
//
// Exactly one of two shapes is returned. Replayable cursor:
// `snapshot_required = false`, `snapshot` unset, `snapshot_sequence =
// last_sequence_applied`, and `events` holds the contiguous retained events
// `last_sequence_applied + 1 ..= current_sequence`. Otherwise
// `snapshot_required = true`, `events` is EMPTY, `snapshot` is a fresh
// consistent projection at `current_sequence`, `snapshot_sequence ==
// snapshot.sequence == current_sequence`, and live events start at
// `snapshot_sequence + 1`.
message SessionResumeResponse {
  bool snapshot_required = 1;
  string snapshot_required_reason = 2;
  SessionSnapshotResponse snapshot = 3;
  repeated Event events = 4;
  uint64 snapshot_sequence = 5;
  uint64 current_sequence = 6;
  uint64 retained_floor_sequence = 7;
  uint32 retained_event_count = 8;
}

// `SessionState` is defined in `events.proto` (see the file header note).

enum BlockKind {
  BLOCK_KIND_UNSPECIFIED = 0;
  BLOCK_KIND_TERMINAL = 1;
}

enum ProgramState {
  PROGRAM_STATE_UNSPECIFIED = 0;
  PROGRAM_STATE_RUNNING = 1;
  PROGRAM_STATE_EXITED = 2;
}
